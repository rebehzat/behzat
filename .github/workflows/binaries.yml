name: Binaries
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux-x64
          - runner: ubuntu-24.04-arm
            platform: linux-arm64
          - runner: macos-15
            platform: darwin-arm64
          - runner: macos-15-intel
            platform: darwin-x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run check && bun test
      - run: bun run licenses && bun run build
      - run: bun scripts/smoke.ts
      - name: Smoke test packaged binary and installation
        shell: bash
        run: |
          export BEHZAT_HOME="$RUNNER_TEMP/behzat-state"
          export PI_OFFLINE=1
          dist/package/bin/behzat --version
          dist/package/bin/behzat doctor
          BEHZAT_INSTALL_DIR="$RUNNER_TEMP/behzat-install" BEHZAT_BIN_DIR="$RUNNER_TEMP/behzat-bin" sh dist/package/install.sh
          "$RUNNER_TEMP/behzat-bin/behzat" doctor
      - name: Package release and checksum
        shell: bash
        run: |
          tar -czf "dist/behzat-${{ matrix.platform }}.tar.gz" -C dist/package .
          cd dist
          shasum -a 256 "behzat-${{ matrix.platform }}.tar.gz" > "behzat-${{ matrix.platform }}.sha256"
      - uses: actions/upload-artifact@v7
        with:
          name: behzat-${{ matrix.platform }}
          path: |
            dist/behzat-${{ matrix.platform }}.tar.gz
            dist/behzat-${{ matrix.platform }}.sha256
          retention-days: 14
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-assets/*
